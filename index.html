<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>にゃんめし検索 🐾</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo"><span>にゃん</span>めし検索 🐾</div>
  <div class="tagline">愛猫にぴったりのごはんを見つけよう</div>
</header>

<div class="container">
  <aside class="sidebar">
    <div class="filter-card">
      <div class="filter-title"><span>🐱</span> 年齢・ライフステージ</div>
      <div class="filter-options" id="filter-age">
        <label class="filter-option"><input type="checkbox" value="子猫">子猫（〜1歳）</label>
        <label class="filter-option"><input type="checkbox" value="成猫">成猫（1〜7歳）</label>
        <label class="filter-option"><input type="checkbox" value="シニア">シニア（7歳〜）</label>
        <label class="filter-option"><input type="checkbox" value="全年齢">全年齢対応</label>
      </div>
    </div>
    <div class="filter-card">
      <div class="filter-title"><span>💪</span> 健康上の悩み</div>
      <div class="filter-options" id="filter-health">
        <label class="filter-option"><input type="checkbox" value="肥満ケア">肥満ケア</label>
        <label class="filter-option"><input type="checkbox" value="毛玉ケア">毛玉ケア</label>
        <label class="filter-option"><input type="checkbox" value="尿路ケア">尿路ケア</label>
        <label class="filter-option"><input type="checkbox" value="関節ケア">関節ケア</label>
        <label class="filter-option"><input type="checkbox" value="皮膚・被毛">皮膚・被毛</label>
      </div>
    </div>
    <div class="filter-card">
      <div class="filter-title"><span>🚫</span> 避けたい食材</div>
      <div class="filter-options" id="filter-allergy">
        <label class="filter-option"><input type="checkbox" value="穀物不使用">穀物不使用</label>
        <label class="filter-option"><input type="checkbox" value="牛肉不使用">牛肉不使用</label>
        <label class="filter-option"><input type="checkbox" value="鶏肉不使用">鶏肉不使用</label>
        <label class="filter-option"><input type="checkbox" value="魚不使用">魚不使用</label>
      </div>
    </div>
    <div class="filter-card">
      <div class="filter-title"><span>💰</span> 価格帯（1kgあたり）</div>
      <div class="filter-options" id="filter-price">
        <label class="filter-option"><input type="checkbox" value="low">〜1000円</label>
        <label class="filter-option"><input type="checkbox" value="mid">1001〜3000円</label>
        <label class="filter-option"><input type="checkbox" value="high">3001円〜</label>
      </div>
    </div>
    <div class="filter-card">
      <div class="filter-title"><span>🌏</span> 産地</div>
      <div class="filter-options" id="filter-origin">
        <label class="filter-option"><input type="checkbox" value="国産">国産</label>
        <label class="filter-option"><input type="checkbox" value="海外">海外</label>
      </div>
    </div>
    <button class="reset-btn" onclick="resetFilters()">🔄 フィルターをリセット</button>
  </aside>

  <main>
    <div class="result-meta" id="result-meta"></div>
    <div class="cards" id="cards"></div>
  </main>
</div>

<script>
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTwKwab16tCJYTES-pzspSSfvIyfY4ki8zEsHpYz0YmY5-BPzMVFVu5l2QgJSxEckEwgiUkLdRZyV1U/pub?gid=575599645&single=true&output=csv';

let products = [];

// CSVをパースしてオブジェクト配列に変換
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim());
  return lines.slice(1).map(line => {
    // 💡 カンマ区切りのセルに対応するため、簡易的なクォート解析を導入
    let values = [];
    let current = '';
    let inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      let char = line[i];
      if (char === '"') {
        inQuotes = !inQuotes;
      } else if (char === ',' && !inQuotes) {
        values.push(current.trim());
        current = '';
      } else {
        current += char;
      }
    }
    values.push(current.trim());
    
    const obj = {};
    headers.forEach((h, i) => obj[h] = values[i] || '');
    return obj;
  }).filter(row => row.id); // idが空の行はスキップ
}

// CSV行をproductオブジェクトに変換
function rowToProduct(row) {
  const price = parseInt(row.price) || 0;
  let priceRange = row.priceRange;
  if (!priceRange) {
    priceRange = price <= 100 ? 'low' : price <= 300 ? 'mid' : 'high';
  }
  
  // 💡 読み込み段階で、あらゆるスペースを消し、「、」や「,」で完璧にバラバラにします
  const cleanSplit = (str) => {
    if (!str || str === '0' || str === 0) return [];
    return str.toString().replace(/[\s\u3000]/g, '').split(/[、,，]/).filter(Boolean);
  };

  return {
    id: row.id,
    brand: row.brand || '',
    name: row.name || '',
    price: price,
    priceRange: priceRange,
    age: row.age || '全年齢',
    health: cleanSplit(row.health),
    avoidIngredients: cleanSplit(row.avoidIngredients),
    origin: row.origin || '国産'
  };
}

// スプレッドシートからデータ読み込み
async function loadData() {
  try {
    const res = await fetch(SHEET_URL);
    if (!res.ok) throw new Error('読み込み失敗');
    const text = await res.text();
    const rows = parseCSV(text);
    products = rows.map(rowToProduct);
    renderCards();
  } catch (e) {
    document.getElementById('cards').innerHTML =
      '<div class="error-msg">⚠️ データの読み込みに失敗しました。<br>スプレッドシートの公開設定を確認してください。</div>';
    document.getElementById('result-meta').textContent = '';
  }
}

function getChecked(id) {
  return [...document.querySelectorAll(`#${id} input:checked`)].map(el => el.value);
}

function filterProducts() {
  const ages     = getChecked('filter-age');
  const healths  = getChecked('filter-health');
  const allergies= getChecked('filter-allergy');
  const prices   = getChecked('filter-price');
  const origins  = getChecked('filter-origin');

  return products.filter(p => {
    // 1. 年齢の絞り込み
    if (ages.length) {
      const productAges = Array.isArray(p.age) ? p.age : [p.age];
      if (!ages.some(a => productAges.includes(a))) return false;
    }
    
    // 2. 健康上の悩みの絞り込み
    if (healths.length) {
      if (!healths.some(h => p.health.includes(h))) return false;
    }
    
    // 3. 避けたい食材の絞り込み
    if (allergies.length) {
      if (!allergies.every(a => p.avoidIngredients.includes(a))) return false;
    }
    
    // 4. 価格帯の絞り込み
    if (prices.length && !prices.includes(p.priceRange)) return false;
    
    // 5. 産地の絞り込み
    if (origins.length && !origins.includes(p.origin)) return false;
    
    return true;
  });
}

function renderCards() {
  const results = filterProducts();
  const container = document.getElementById('cards');
  const meta = document.getElementById('result-meta');
  
  meta.innerHTML = `<strong>${results.length}</strong>件のフードが見つかりました`;

  if (results.length === 0) {
    container.innerHTML = `
      <div class="no-result">
        <div class="big">🐱</div>
        <p>条件に合うフードが見つかりませんでした。<br>フィルターを変えてみてください。</p>
      </div>`;
    return;
  }

  container.innerHTML = results.map(p => `
    <div class="product-card">
      <div class="card-brand">${p.brand}</div>
      <div class="card-name">${p.name}</div>
      <div class="card-price">¥${p.price}<span> / 1食</span></div>
      <div class="tags">
        <span class="tag tag-age">${p.age}</span>
        ${p.health.map(h => `<span class="tag tag-health">${h}</span>`).join('')}
        ${p.origin === '国産' ? '<span class="tag tag-origin">🇯🇵 国産</span>' : '<span class="tag tag-origin">🌏 輸入</span>'}
        ${p.avoidIngredients.includes('穀物不使用') ? '<span class="tag tag-allergy">穀物不使用</span>' : ''}
      </div>
    </div>
  `).join('');
}

function resetFilters() {
  document.querySelectorAll('.filter-option input').forEach(el => el.checked = false);
  renderCards();
}

document.querySelectorAll('.filter-option input').forEach(el => {
  el.addEventListener('change', renderCards);
});

loadData();
</script>
</body>
</html>
